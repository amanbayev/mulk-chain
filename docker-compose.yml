services:
  postgres:
    image: postgres:16-alpine
    container_name: mulk-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mulk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mulk}
      POSTGRES_DB: ${POSTGRES_DB:-mulk_chain}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mulk_pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mulk} -d ${POSTGRES_DB:-mulk_chain}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mulk-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - mulk_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mulk_pg_data:
  mulk_redis_data:
