[profile.default]
src = "packages/contracts/src"
out = "packages/contracts/out"
test = "packages/contracts/test"
script = "packages/contracts/script"
libs = ["lib", "packages/contracts/lib"]
solc_version = "0.8.24"
# solc 0.8.24 + via_ir overflows the Yul stack on this suite ("Variable _400 is 1 too deep").
via_ir = false
optimizer = true
optimizer_runs = 200
ffi = false
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read-write", path = "./" }]
gas_reports = ["MulkToken", "EnforcementController", "IdentityRegistry", "GovOracle"]

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"

# Arbiscan V1 (api-sepolia.arbiscan.io) is deprecated. Etherscan API V2 verifies chain 421614.
[etherscan]
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}", url = "https://api.etherscan.io/v2/api" }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
multiline_func_header = "params_first"
